name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch newly published advisories without a code change.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

# Job names are required status checks (docs/dev/ci.md): rename one only
# together with the main branch ruleset.
jobs:
  lint:
    name: Lint (oxlint, biome, tsc, knip)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
        if: ${{ !cancelled() }}
      - run: bun run typecheck
        if: ${{ !cancelled() }}
      - run: bun run dead-code
        if: ${{ !cancelled() }}

  audit:
    name: Audit (bun audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run audit

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # CloudShell is Linux; macOS is where most users run it locally.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage

  package:
    name: Package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --pack-destination "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 14

  # The package must run on plain Node.js (CloudShell's, via npx), never
  # needing Bun. Installs the packed tarball with npm, runs both bins, and
  # gates cold start against the spec's 300 ms budget.
  node:
    name: Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Lowest is engines.node in package.json; keep the two in sync.
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      - name: Install and run the tarball
        run: bash scripts/pack-smoke.sh "$RUNNER_TEMP"/pkg/*.tgz
      - name: Cold start
        run: |
          tar -xzf "$RUNNER_TEMP"/pkg/*.tgz -C "$RUNNER_TEMP"
          node scripts/startup.mjs "$RUNNER_TEMP/package/dist/cli.mjs"

  actionlint:
    name: Workflow lint (actionlint)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same version as lint:workflows in package.json. The runner's
      # shellcheck checks the run: scripts.
      - name: Install actionlint
        run: python3 -m pip install actionlint-py==1.7.12.25
      - name: actionlint
        run: actionlint -color

  zizmor:
    name: Zizmor
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same version as lint:workflows in package.json.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.24.1
          persona: auditor
          # Findings fail the job in its log. Uploading SARIF instead would
          # need security-events: write, which fork PRs never get.
          advanced-security: false

  semgrep:
    name: Semgrep
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --error fails the job on findings; the always() upload keeps the SARIF.
      # The image is pinned by digest (semgrep/semgrep:1.178.0) and dependabot
      # does not track it: bump the tag and digest together by hand.
      - name: Run Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/default --error --sarif --output semgrep.sarif
      # Fork PRs get a read-only token and cannot upload; their findings still
      # fail the scan step above.
      - name: Upload SARIF to code scanning
        if: >-
          ${{ always() && hashFiles('semgrep.sarif') != ''
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
