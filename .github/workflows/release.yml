name: Release

# A v* tag publishes the package to npm and creates a GitHub Release.
# Before the first release, finish "Releases" in docs/dev/ci.md: package.json
# is "private": true until then, and npm refuses to publish it.
#
# Running it by hand (workflow_dispatch) is a rehearsal on any branch: every
# job runs, publish is `npm publish --dry-run` with no OIDC token, and no
# release is created. Tag checks become warnings.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Checks what the tag points at; who may push a v* tag is the tag ruleset's job.
      - name: Tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_name }}
          # A rehearsal reports what a tag here would fail on, and goes on.
          LEVEL: ${{ github.event_name == 'push' && 'error' || 'warning' }}
        run: |
          status=0
          want="v$(jq -r .version package.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::$LEVEL::$TAG does not match package.json version ($want)"
            status=1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::$LEVEL::$TAG points at a commit that is not on main"
            status=1
          fi
          if [ "$LEVEL" = error ]; then exit "$status"; fi

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the release: a poisoned cache would ship.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      # An advisory published since the last main run stops the release.
      - run: bun run audit
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - name: npm pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error

  node:
    name: Node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as ci.yml; lowest is engines.node in package.json.
        node: ["20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      - run: bash scripts/pack-smoke.sh "$RUNNER_TEMP"/pkg/*.tgz
      - name: Cold start
        run: |
          tar -xzf "$RUNNER_TEMP"/pkg/*.tgz -C "$RUNNER_TEMP"
          node scripts/startup.mjs "$RUNNER_TEMP/package/dist/cli.mjs"

  # Publishes the exact tarball the node jobs installed. Trusted Publishing
  # (OIDC): no npm token exists anywhere; provenance links the package to
  # this run.
  publish:
    name: Publish to npm
    needs: node
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.21.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      - run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public

  # The rehearsal's publish: same npm, same tarball, nothing uploaded.
  publish-dry-run:
    name: Publish to npm (dry run)
    needs: node
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11.21.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      # npm refuses a private package even in a dry run; that refusal is the
      # expected state until the first release, so it is a warning here.
      - name: npm publish --dry-run
        run: |
          tgz=$(echo "$RUNNER_TEMP"/pkg/*.tgz)
          if [ "$(tar -xzOf "$tgz" package/package.json | jq -r '.private // false')" = true ]; then
            echo '::warning::package.json is "private": true; a tag would stop at Publish to npm'
            exit 0
          fi
          npm publish "$tgz" --dry-run --access public
      - name: Release assets
        working-directory: ${{ runner.temp }}/pkg
        run: sha256sum ./*.tgz | tee SHA256SUMS

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg
      # `gh attestation verify <tgz> -R watany-dev/lazycodecommit` checks a
      # downloaded asset came from this workflow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.tgz
      # Every asset goes up in the create call, so immutable releases work.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd pkg
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*.tgz SHA256SUMS
