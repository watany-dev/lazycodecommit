version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in bunfig.toml.
    cooldown:
      default-days: 7
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types for the oldest supported Node (engines.node), so they never
      # offer an API that Node 20 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
